<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LabSlot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,600;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#F7F2E4; --inner:#FBF8EC; --mint:#D8E6D4; --mint-deep:#CDE4CE;
    --yellow:#F5ED9C; --accent:#EDE17C; --pink:#F2CFDB; --blue:#D8E2E9; --taupe:#CBC2AD;
    --ink:#33322C; --muted:#8A8878; --faint:#B4AE97; --track:#EDE8D2;
    --green:#3E6B4F;
  }
  body{min-height:100vh;background:#ECECF1;display:flex;align-items:center;justify-content:center;
    font-family:'Inter',system-ui,sans-serif;color:var(--ink);padding:20px}
  .serif{font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:700}

  /* ------- phone frame ------- */
  .phone{width:402px;height:848px;border-radius:58px;padding:10px;position:relative;
    background:linear-gradient(160deg,#cfc2f2,#b3a1e6 38%,#d9cfa9 72%,#b3a1e6);
    box-shadow:0 44px 90px rgba(60,50,110,.35), inset 0 0 0 2px rgba(255,255,255,.4)}
  .screen{position:relative;width:100%;height:100%;background:var(--bg);border-radius:48px;
    overflow:hidden;border:7px solid #101010}
  .island{position:absolute;top:16px;left:50%;transform:translateX(-50%);width:112px;height:32px;
    background:#0c0c0c;border-radius:18px;z-index:70;pointer-events:none}
  .island::after{content:'';position:absolute;right:14px;top:50%;transform:translateY(-50%);
    width:10px;height:10px;border-radius:50%;background:#1d2030;box-shadow:inset 0 0 3px #3b4b7a}

  /* ------- screens ------- */
  .scr{position:absolute;inset:0;overflow-y:auto;padding:62px 18px 116px;opacity:0;
    pointer-events:none;transition:opacity .16s ease;scrollbar-width:none}
  .scr::-webkit-scrollbar{display:none}
  .scr.on{opacity:1;pointer-events:auto;animation:rise .22s ease}
  @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .scr.bare{padding-bottom:44px}

  /* ------- shared bits ------- */
  .hello{font-size:14px;color:#6E6A58;margin:8px 0 0 4px}
  .brand{font-size:42px;letter-spacing:.5px;margin:0 0 16px 2px}
  .back{display:inline-flex;align-items:center;gap:6px;color:#7C7767;background:none;border:none;
    font-size:15px;cursor:pointer;font-family:inherit;margin-bottom:8px;padding:4px 2px}
  .d-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  .d-title{font-size:32px;line-height:1.1}
  .d-sub{color:var(--muted);font-size:13.5px;margin-top:5px}
  .d-meta{text-align:right;flex-shrink:0}
  .d-coord{font-size:12.5px;color:var(--muted);margin-bottom:6px;letter-spacing:.3px}

  .badge{display:inline-block;padding:5px 13px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
  .b-avl{background:var(--accent);color:#4d4413}
  .b-use{background:var(--blue);color:#33586B}
  .b-mnt{background:var(--pink);color:#8A3B58}
  .b-rsv{background:var(--mint-deep);color:#2E5B3C}
  .b-up{background:var(--mint-deep);color:#2E5B3C}
  .b-done{background:var(--taupe);color:#4d4636}

  .sec{border-radius:26px;padding:16px 14px 10px;margin-bottom:18px}
  .sec.mint{background:var(--mint)} .sec.yellow{background:var(--yellow)}
  .sec-head{display:flex;margin-bottom:12px}
  .sec-band{flex:1;background:rgba(255,255,255,.32);border-radius:12px;padding:2px 12px}
  .sec-title{font-size:25px}

  .search{display:flex;align-items:center;gap:8px;background:var(--inner);border-radius:999px;
    padding:12px 16px;margin-bottom:12px}
  .search input{flex:1;border:none;background:transparent;outline:none;font-size:15px;
    font-family:inherit;color:var(--ink)}
  .search input::placeholder{color:var(--faint)}
  .search svg{flex-shrink:0;opacity:.55}

  .item{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--inner);
    border-radius:16px;padding:12px 14px;margin-bottom:10px;cursor:pointer;transition:transform .12s}
  .item:active{transform:scale(.975)}
  .item b{font-size:15px;font-weight:600;display:block}
  .item small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}
  .bar{width:104px;height:7px;background:var(--track);border-radius:99px;overflow:hidden;flex-shrink:0}
  .bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .3s}
  .pct{font-size:13px;font-weight:600;width:42px;text-align:right;flex-shrink:0}

  .artcard{background:var(--inner);border-radius:22px;display:flex;align-items:center;
    justify-content:center;padding:24px 0;margin:16px 0}
  .artcard.p{padding:0;overflow:hidden}
  .artimg{width:100%;height:215px;object-fit:cover;display:block}
  .thumb{width:50px;height:50px;border-radius:13px;object-fit:cover;flex-shrink:0;display:block}
  .info{background:var(--inner);border-radius:20px;padding:16px 18px;margin-bottom:18px}
  .row{display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:7px 0;font-size:14.5px}
  .row span{color:var(--muted);flex-shrink:0}
  .row b{font-weight:600;text-align:right}

  .pills{display:flex;flex-wrap:wrap;gap:12px;margin-top:2px}
  .pill{border:none;border-radius:999px;padding:13px 22px;font-size:16px;cursor:pointer;color:#3A382F;
    font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:600;
    transition:transform .12s,opacity .15s}
  .pill:active{transform:scale(.95)}
  .pill[disabled]{opacity:.45;cursor:not-allowed}
  .p-yellow{background:var(--accent)} .p-blue{background:var(--blue)} .p-pink{background:var(--pink)}
  .p-mint{background:var(--mint-deep)} .p-taupe{background:var(--taupe)}
  .bigpill{display:block;margin:18px auto 0;background:var(--accent);border:none;border-radius:999px;
    padding:15px 36px;font-size:17px;cursor:pointer;color:#3A382F;
    font-family:'Playfair Display',Georgia,serif;font-style:italic;font-weight:600;transition:transform .12s}
  .bigpill:active{transform:scale(.96)}

  /* calendar + time */
  .cal{background:var(--inner);border-radius:20px;padding:16px;margin-bottom:14px}
  .cal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
  .cal-head h3{font-family:'Playfair Display',serif;font-style:italic;font-size:19px;font-weight:700}
  .mbtn{width:32px;height:32px;border-radius:50%;border:none;background:transparent;cursor:pointer;
    color:var(--muted);font-size:15px;display:flex;align-items:center;justify-content:center}
  .mbtn:hover{background:#F1EBD8}
  .cgrid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;row-gap:6px}
  .cdow{font-size:11.5px;color:var(--faint);padding:6px 0;font-weight:600}
  .cd{width:34px;height:34px;display:flex;align-items:center;justify-content:center;font-size:13.5px;
    border-radius:50%;cursor:pointer;margin:0 auto;color:var(--ink)}
  .cd:hover{background:#F1EBD8}
  .cd.dim{color:#C9C4B0;pointer-events:none}
  .cd.sel{background:var(--accent);font-weight:700}
  .cd.today{box-shadow:inset 0 0 0 1.5px #C9B96A}
  .timecard{background:var(--inner);border-radius:20px;padding:16px;text-align:center;margin-bottom:4px}
  .tlabel{font-size:11px;letter-spacing:2.5px;color:var(--muted);font-weight:600;margin-bottom:8px}
  .trow{display:flex;align-items:center;justify-content:center;gap:16px}
  .tcol{display:flex;flex-direction:column;align-items:center}
  .tval{font-family:'Playfair Display',serif;font-size:36px;font-weight:600;
    border-bottom:2px solid #D9D2B8;padding:0 12px 2px;min-width:78px}
  .step{background:none;border:none;cursor:pointer;color:var(--faint);font-size:11px;padding:4px 18px}
  .step:hover{color:var(--ink)}
  .wheel{display:flex;align-items:center;justify-content:center;gap:12px;margin:4px 0 14px}
  .wvals{display:flex;flex-direction:column;align-items:center}
  .wnb{font-family:'Playfair Display',serif;font-size:14px;color:#C9C4B0;min-width:78px;text-align:center;line-height:1.7}
  .wunit{font-family:'Playfair Display',serif;font-size:17px;color:var(--muted)}
  .colon{font-family:'Playfair Display',serif;font-size:28px;color:var(--muted);padding-bottom:14px}
  .ok{background:var(--mint-deep);border-radius:20px;padding:24px 18px;text-align:center;
    font-family:'Playfair Display',Georgia,serif;font-style:italic;font-size:19px;color:#2E5B3C}

  /* forms */
  .field{background:var(--inner);border-radius:20px;padding:14px 16px;margin-bottom:14px}
  .field label{font-size:12px;color:var(--faint);display:block;margin-bottom:5px}
  .field b{font-size:16px;font-weight:600}
  .field input,.field textarea{width:100%;border:none;background:transparent;outline:none;
    font:inherit;font-size:15px;color:var(--ink);resize:none}
  .field textarea{min-height:128px}
  .field input::placeholder,.field textarea::placeholder{color:var(--faint)}

  .note{background:#F7E3EA;border-radius:16px;padding:14px 16px;font-size:13.5px;color:#7c4560;margin-bottom:14px}
  .card{background:var(--inner);border-radius:20px;padding:16px 18px;margin-bottom:14px}
  .card h4{font-family:'Playfair Display',serif;font-style:italic;font-size:17px;margin-bottom:10px}
  .card p{font-size:14px;line-height:1.55;color:#55524a}
  .card ol{padding-left:20px;font-size:14px;line-height:1.8;color:#55524a}

  /* profile */
  .phead{display:flex;align-items:center;gap:14px;margin:8px 2px 16px}
  .avatar{width:62px;height:62px;border-radius:50%;background:var(--accent);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    font-family:'Playfair Display',serif;font-style:italic;font-size:21px;font-weight:700}
  .avatar.sm{width:40px;height:40px;font-size:14px}
  .phead h2{font-size:24px}
  .phead small{display:block;color:var(--muted);font-size:13px;margin-top:3px}
  .menu{background:var(--inner);border-radius:20px;overflow:hidden;margin-bottom:16px}
  .mrow{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid #F0EBD8;
    cursor:pointer;font-size:14.5px;font-weight:500;background:none;border-left:none;border-right:none;
    border-top:none;width:100%;text-align:left;font-family:inherit;color:var(--ink)}
  .mrow:last-child{border-bottom:none}
  .mrow:active{background:#F3EEDC}
  .mi{width:34px;height:34px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .mi.y{background:var(--accent)} .mi.m{background:var(--mint-deep)} .mi.p{background:var(--pink)}
  .mi.b{background:var(--blue)} .mi.t{background:var(--taupe)}
  .dot{background:#E2738F;color:#fff;border-radius:99px;font-size:10.5px;font-weight:700;
    padding:2.5px 8px;margin-left:auto}
  .chev{margin-left:auto;color:#C2BCA6;display:flex}
  .dot + .chev{margin-left:8px}

  .msg{display:flex;gap:12px;background:var(--inner);border-radius:18px;padding:13px 14px;
    margin-bottom:10px;cursor:pointer;align-items:flex-start}
  .msg:active{transform:scale(.985)}
  .msg.unread{box-shadow:inset 0 0 0 1.5px #E8DEA8}
  .msg b{font-size:14px;display:block}
  .msg p{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.45}
  .msg time{font-size:11px;color:var(--faint);white-space:nowrap;margin-left:auto;flex-shrink:0}

  .rec{display:flex;gap:12px;background:var(--inner);border-radius:16px;padding:12px 14px;
    margin-bottom:10px;align-items:center;cursor:pointer}
  .rec:active{transform:scale(.985)}
  .rec b{font-size:14.5px;font-family:'Playfair Display',serif;font-style:italic}
  .rec small{display:block;color:var(--muted);font-size:12.5px;margin-top:2px}

  .hrow{display:flex;align-items:center;gap:12px;padding:11px 4px;border-bottom:1px solid #EFE9D6}
  .hrow:last-child{border-bottom:none}
  .hicon{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;
    justify-content:center;font-size:13px;font-weight:700;font-family:'Playfair Display',serif;font-style:italic}
  .hrow b{font-size:13.5px;display:block}
  .hrow small{color:var(--muted);font-size:12px}
  .hrow time{margin-left:auto;font-size:11px;color:var(--faint);white-space:nowrap}

  .chip{background:var(--inner);border:1px solid #E6DFC8;border-radius:999px;padding:10px 18px;
    font-size:14px;cursor:pointer;font-family:inherit;color:var(--ink);transition:transform .12s}
  .chip:active{transform:scale(.96)}
  .empty{text-align:center;color:var(--faint);padding:30px 10px;font-size:13.5px;line-height:1.6}

  /* tabbar */
  .tabbar{position:absolute;left:0;right:0;bottom:0;height:94px;background:#FBF7E9;z-index:40;
    display:flex;justify-content:space-around;padding-top:14px;
    box-shadow:0 -10px 26px rgba(120,110,80,.09);border-radius:0 0 41px 41px}
  .tabbar.hidden{display:none}
  .tab{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--faint);
    width:70px;background:none;border:none;cursor:pointer;font-family:inherit}
  .tab.active{color:var(--ink)}
  .scanbtn{width:60px;height:60px;border-radius:50%;background:var(--accent);cursor:pointer;
    border:6px solid #FBF7E9;margin-top:-32px;display:flex;align-items:center;justify-content:center;
    box-shadow:0 8px 16px rgba(160,140,60,.28);transition:transform .12s}
  .scanbtn:active{transform:scale(.93)}

  /* scan overlay */
  .scanlay{position:absolute;inset:0;background:linear-gradient(180deg,#DCE8D8 0%,#F7F2E4 75%);z-index:80;
    display:none;flex-direction:column;align-items:center;padding:70px 24px 30px}
  .scanlay.on{display:flex;animation:rise .2s ease}
  .sframe{width:225px;height:225px;border-radius:26px;position:relative;margin:34px 0 26px}
  .sframe i{position:absolute;width:34px;height:34px;border:3.5px solid #55604d;border-radius:6px}
  .sframe i:nth-child(1){top:0;left:0;border-right:none;border-bottom:none}
  .sframe i:nth-child(2){top:0;right:0;border-left:none;border-bottom:none}
  .sframe i:nth-child(3){bottom:0;left:0;border-right:none;border-top:none}
  .sframe i:nth-child(4){bottom:0;right:0;border-left:none;border-top:none}
  .sline{position:absolute;left:14px;right:14px;height:3px;border-radius:3px;background:#E3CF5B;
    box-shadow:0 0 10px #E3CF5B;animation:scan 2.1s ease-in-out infinite}
  @keyframes scan{0%,100%{top:10%}50%{top:88%}}
  .stext{color:#6a7261;font-size:13.5px;text-align:center;line-height:1.6;margin-bottom:22px}
  .scan-h{font-size:26px;margin-bottom:4px}

  /* modal */
  .modal{position:absolute;inset:0;background:rgba(40,38,30,.38);z-index:85;display:none;align-items:flex-end}
  .modal.on{display:flex}
  .sheet{background:var(--bg);border-radius:26px 26px 0 0;width:100%;padding:20px 18px 30px;
    max-height:76%;overflow-y:auto;animation:up .22s ease}
  @keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
  .sheet h3{font-family:'Playfair Display',serif;font-style:italic;font-size:22px;margin-bottom:14px}

  .toast{position:absolute;left:50%;bottom:112px;transform:translateX(-50%) translateY(12px);
    background:#33322C;color:#FBF7E9;padding:11px 20px;border-radius:999px;font-size:13px;
    opacity:0;transition:.25s;z-index:95;pointer-events:none;max-width:82%;text-align:center}
  .toast.on{opacity:1;transform:translateX(-50%)}

  .amtrow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
  .amtrow .field{flex:1;margin:0}
  @media (max-height:920px){.phone{transform:scale(.92)}}
  @media (max-height:840px){.phone{transform:scale(.84)}}
  @media (max-height:760px){.phone{transform:scale(.76)}}
</style>
</head>
<body>

<div class="phone"><div class="screen">
  <div class="island"></div>

  <!-- ============ LOGIN ============ -->
  <section class="scr bare on" id="s-login">
    <div style="text-align:center;margin-top:66px">
      <div style="width:74px;height:74px;border-radius:50%;background:var(--accent);margin:0 auto 16px;
        display:flex;align-items:center;justify-content:center">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#4d4413" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M10 3h4M11 3v5.5L5.8 17a3 3 0 0 0 2.6 4.5h7.2A3 3 0 0 0 18.2 17L13 8.5V3"/>
          <path d="M7.5 14.5h9"/>
        </svg>
      </div>
      <h1 class="serif" style="font-size:44px">LabSlot</h1>
      <p style="color:var(--muted);font-size:13.5px;margin:6px 0 30px" data-i18n="l_sub">Lab equipment &amp; reagents, one tap away.</p>
    </div>
    <div class="field"><label data-i18n="l_user">Username</label><input id="l-user" data-i18n-ph="l_user_ph" placeholder="e.g. stina.levin" autocomplete="off"></div>
    <div class="field"><label data-i18n="l_pass">Password</label><input id="l-pass" type="password" placeholder="••••••••"></div>
    <button class="bigpill" style="margin-top:22px" id="btn-login" data-i18n="l_signin">Sign In</button>
    <p style="text-align:center;color:var(--faint);font-size:12px;margin:24px 0 12px;letter-spacing:.4px" data-i18n="l_or">— or continue with —</p>
    <div style="display:flex;justify-content:center;gap:10px;flex-wrap:wrap" id="saved-accts"></div>
  </section>

  <!-- ============ HOME ============ -->
  <section class="scr" id="s-home">
    <p class="hello"><span data-i18n="hello_pre">Hello, </span><span id="h-name">Stina</span><span data-i18n="hello_suf"> !</span></p>
    <h1 class="serif brand">LabSlot</h1>

    <div class="sec mint">
      <div class="sec-head"><div class="sec-band"><h2 class="serif sec-title" data-i18n="sec_instr">Instruments</h2></div></div>
      <div class="search">
        <input id="q-e" data-i18n-ph="q_e_ph" placeholder="Search instruments...">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8A8878" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </div>
      <div id="list-e"></div>
    </div>

    <div class="sec yellow">
      <div class="sec-head"><div class="sec-band"><h2 class="serif sec-title" data-i18n="sec_reag">Reagents</h2></div></div>
      <div class="search">
        <input id="q-r" data-i18n-ph="q_r_ph" placeholder="Search reagents...">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="#8A8878" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </div>
      <div id="list-r"></div>
    </div>
  </section>

  <!-- ============ DYNAMIC SCREENS ============ -->
  <section class="scr" id="s-equip"></section>
  <section class="scr" id="s-reag"></section>
  <section class="scr" id="s-resv"></section>
  <section class="scr" id="s-msg"></section>
  <section class="scr" id="s-instr"></section>
  <section class="scr" id="s-profile"></section>
  <section class="scr" id="s-inbox"></section>
  <section class="scr" id="s-appts"></section>
  <section class="scr" id="s-history"></section>
  <section class="scr" id="s-switch"></section>

  <!-- ============ TABBAR ============ -->
  <nav class="tabbar hidden" id="tabbar">
    <button class="tab active" id="tab-home">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1Z"/></svg>
      <span data-i18n="home">Home</span></button>
    <button class="scanbtn" id="btn-scan" aria-label="\u626B\u7801">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#4d4413" stroke-width="2.1" stroke-linecap="round"><path d="M4 8V5.5A1.5 1.5 0 0 1 5.5 4H8M16 4h2.5A1.5 1.5 0 0 1 20 5.5V8M20 16v2.5a1.5 1.5 0 0 1-1.5 1.5H16M8 20H5.5A1.5 1.5 0 0 1 4 18.5V16"/><path d="M12 8.5v7M8.5 12h7"/></svg>
    </button>
    <button class="tab" id="tab-profile">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c1.2-3.4 3.8-5 7-5s5.8 1.6 7 5"/></svg>

  </div>

/* ================= profile ================= */
function renderProfile(){
 const u=state.user;if(!u)return;
 const uRole=LANG==='zh'?(u.rZh||u.role):u.role;
 const uLab=LANG==='zh'?(u.lZh||u.lab):u.lab;
 $('#s-profile').innerHTML=`
  <button class="back" onclick="navBack()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></svg>${t('back')}</button>
  <div class="phead">
    <div class="avatar">${u.initials}</div>
    <div><h2 class="serif">${u.name}</h2><small>${uRole} \u00B7 ${uLab}</small></div>
  </div>
  <div class="info" style="margin-bottom:16px">
    <div class="row"><span>${t('d_email')}</span><b>${u.email}</b></div>
    <div class="row"><span>${t('pr_since')}</span><b>${LANG==='zh'?'2024\u5E749\u6708':'Sep 2024'}</b></div>
    <div class="row"><span>${t('pr_appts_n')}</span><b>${state.appts.filter(a=>a.status==='up').length}</b></div>
  </div>
  <div class="menu">
    <button class="mrow" id="p-msgs"><span class="mi y">${IC.msg}</span>${t('me_msgs')}
      ${state.unread?`<span class="dot">${state.unread}</span>`:''}${state.unread?'':`<span class="chev">${IC.chev}</span>`}</button>
    <button class="mrow" id="p-appts"><span class="mi m">${IC.cal}</span>${t('me_appts')}<span class="chev">${IC.chev}</span></button>
    <button class="mrow" id="p-hist"><span class="mi b">${IC.clk}</span>${t('me_hist')}<span class="chev">${IC.chev}</span></button>
  </div>
  <div class="menu">
    <button class="mrow" id="p-pw"><span class="mi p">${IC.lock}</span>${t('me_pw')}<span class="chev">${IC.chev}</span></button>
    <button class="mrow" id="p-sw"><span class="mi t">${IC.swap}</span>${t('me_switch')}<span class="chev">${IC.chev}</span></button>
    <button class="mrow" id="p-out"><span class="mi p">${IC.out}</span>${t('me_out')}</button>
  </div>
  <p style="text-align:center;color:var(--faint);font-size:11px;margin-top:6px">LabSlot \u00B7 v0.1 \u6982\u5FF5\u7248</p>`;
 $('#p-msgs').onclick=()=>openInbox();
 $('#p-appts').onclick=()=>openAppts();
 $('#p-hist').onclick=()=>openHistory();
 $('#p-pw').onclick=changePw;
 $('#p-sw').onclick=()=>openSwitch();
 $('#p-out').onclick=()=>{state.user=null;state.stack=[];show('s-login');toast(t('ts_out'))};
}

/* ================= inbox / appointments / history ================= */
function openInbox(){
 $('#s-inbox').innerHTML=`
  <button class="back" onclick="navBack()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></svg>${t('back')}</button>
  <h1 class="serif" style="font-size:32px;margin-bottom:16px">${t('ti_msgs')}</h1>
  ${state.msgs.length?state.msgs.map((m,i)=>`
    <div class="msg ${m.read?'':'unread'}" data-i="${i}">
      <div class="avatar sm" style="background:${m.col}">${m.ini}</div>
      <div style="flex:1"><b>${FROM[m.from]?FROM[m.from][LANG]:m.from}</b><p>${m.text[LANG]||m.text}</p></div><time>${fmtWhen(m)}</time>
    </div>`).join(''):`<div class="empty">${t('em_msgs')}</div>`}`;
 document.querySelectorAll('#s-inbox .msg').forEach(el=>el.onclick=()=>{
   const m=state.msgs[+el.dataset.i];
   if(!m.read){m.read=true;if(state.unread>0)state.unread--}
   openInbox();});
 go('s-inbox');
}
function openAppts(){
 $('#s-appts').innerHTML=`
  <button class="back" onclick="navBack()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></svg>${t('back')}</button>
  <h1 class="serif" style="font-size:32px;margin-bottom:16px">${t('ti_appts')}</h1>
  ${state.appts.length?state.appts.map(a=>{
    const it=itemById(a.id);
    return `<div class="item" style="cursor:default">
      <div><b style="font-family:'Playfair Display',serif;font-style:italic;font-size:17px">${name(it)}</b>
        <small>${fmtApptDate(a.date)} \u00B7 ${a.time}${a.pj?` \u00B7 ${esc(a.pj)}`:''}</small></div>
      <span class="badge ${a.status==='up'?'b-up':'b-done'}">${a.status==='up'?t('st_up'):t('st_done')}</span>
    </div>`}).join(''):`<div class="empty">${t('em_appts')}</div>`}`;
 go('s-appts');
}
function openHistory(){
 $('#s-history').innerHTML=`
  <button class="back" onclick="navBack()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></svg>${t('back')}</button>
  <h1 class="serif" style="font-size:32px;margin-bottom:14px">${t('ti_hist')}</h1>
  <div class="card">
  ${state.hist.length?state.hist.map(h=>{
    const it=itemById(h.id);
    const col={y:'var(--accent)',b:'var(--blue)',p:'var(--pink)',m:'var(--mint-deep)'}[h.k]||'var(--mint-deep)';
    return `<div class="hrow"><div class="hicon" style="background:${col}">${name(it)[0]}</div>
      <div><b>${name(it)}</b><small>${actLabel(h.act)}${h.act[2]?` \u00B7 ${esc(h.act[2])}`:''}</small></div><time>${fmtWhen(h)}</time></div>`}).join('')
   :`<div class="empty">${t('em_hist')}</div>`}
  </div>`;
 go('s-history');
}

/* ================= switch account ================= */
function openSwitch(){
 $('#s-switch').innerHTML=`
  <button class="back" onclick="navBack()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m14 6-6 6 6 6"/></svg>${t('back')}</button>
  <h1 class="serif" style="font-size:32px;margin-bottom:16px">${t('me_switch')}</h1>
  ${ACCOUNTS.map((a,i)=>`
    <div class="rec" data-i="${i}" style="margin-bottom:10px">
      <div class="avatar sm">${a.initials}</div>
      <div style="flex:1"><b>${a.name}</b><small>${LANG==='zh'?(a.rZh||a.role):a.role} \u00B7 ${LANG==='zh'?(a.lZh||a.lab):a.lab}</small></div>
      ${state.user&&state.user.name===a.name?`<span style="color:var(--green);font-weight:700">\u2713</span>`:''}
    </div>`).join('')}`;
 document.querySelectorAll('#s-switch .rec').forEach(el=>el.onclick=()=>{
   switchTo(ACCOUNTS[+el.dataset.i])});
 go('s-switch');
}
function switchTo(a){
 state.user=a;state.stack=[];setTabHome();toast(t('ts_switch').replace('%s',a.name));
}
function setTabHome(){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
 $('#tab-home').classList.add('active');show('s-home')}

/* ================= login ================= */
function renderSaved(){
 $('#saved-accts').innerHTML=ACCOUNTS.map((a,i)=>`<button class="chip" data-i="${i}">${a.name.split(' ')[0]}</button>`).join('');
 document.querySelectorAll('#saved-accts .chip').forEach(c=>c.onclick=()=>switchTo(ACCOUNTS[+c.dataset.i]));
}
function doLogin(){
 const un=$('#l-user').value.trim(),pw=$('#l-pass').value;
 if(!un||!pw)return toast(t('ts_fill'));
 let a=ACCOUNTS.find(x=>x.name.toLowerCase().includes(un.split('.')[0].toLowerCase())||x.email.startsWith(un));
 if(!a)a={name:un.replace(/[._]/g,' ').replace(/\b\w/g,c=>c.toUpperCase()),role:'Lab Member',
   rZh:'\u5B9E\u9A8C\u5BA4\u6210\u5458',
   lab:'Molecular Biology Lab \u00B7 5F',lZh:'\u5206\u5B50\u751F\u7269\u5B66\u5B9E\u9A8C\u5BA4 \u00B7 5F',
   email:un.includes('@')?un:un+'@uni.edu',
   initials:un.slice(0,2).toUpperCase()};
 $('#l-pass').value='';
 state.user=a;state.stack=[];setTabHome();toast(t('ts_welcome').replace('%s',a.name.split(' ')[0]));
}
$('#btn-login').onclick=doLogin;
$('#l-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});

/* ================= scan ================= */
$('#btn-scan').onclick=()=>{$('#scanlay').classList.add('on')};
function closeScan(){$('#scanlay').classList.remove('on')}
const SCAN_TARGETS=[
 {id:'cyto',fn:()=>{closeScan();openEquip('cyto')}},
 {id:'pbs',fn:()=>{closeScan();openReag('pbs')}},
];
function renderScanChips(){
 $('#scan-chips').innerHTML=SCAN_TARGETS.map((c,i)=>`<button class="chip" data-i="${i}">${name(itemById(c.id))}</button>`).join('');
 document.querySelectorAll('#scan-chips .chip').forEach(el=>{
  el.onclick=()=>{SCAN_TARGETS[+el.dataset.i].fn();toast(t('ts_qr'))}});
}

/* ================= modal / change password ================= */
function openModal(html){$('#sheet').innerHTML=html;$('#modal').classList.add('on')}
function closeModal(){$('#modal').classList.remove('on')}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function changePw(){
 openModal(`<h3>${t('pw_title')}</h3>
  <div class="field"><label>${t('pw_cur')}</label><input type="password" id="pw-c"></div>
  <div class="field"><label>${t('pw_new')}</label><input type="password" id="pw-n"></div>
  <div class="field"><label>${t('pw_new2')}</label><input type="password" id="pw-n2"></div>
  <button class="bigpill" id="pw-save" style="margin-top:4px">${t('pw_save')}</button>`);
 $('#pw-save').onclick=()=>{
   const c=$('#pw-c').value,n=$('#pw-n').value,n2=$('#pw-n2').value;
   if(!c||!n)return toast(t('ts_pw_fill'));
   if(n!==n2)return toast(t('ts_pw_match'));
   closeModal();toast(t('ts_pw_saved'));};
}

/* ================= static labels ================= */
function applyStatic(){
 document.querySelectorAll('[data-i18n]').forEach(el=>{el.innerHTML=t(el.dataset.i18n)});
 document.querySelectorAll('[data-i18n-ph]').forEach(el=>{el.placeholder=t(el.dataset.i18nPh)});
}

/* ================= boot ================= */
$('#tab-home').onclick=()=>setTab('s-home',$('#tab-home'));
$('#tab-profile').onclick=()=>{if(!state.user)return show('s-login');
  state.stack=[];document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  $('#tab-profile').classList.add('active');show('s-profile')};
applyStatic();
renderScanChips();
renderSaved();
show('s-login');
</script>
</body>
</html>
